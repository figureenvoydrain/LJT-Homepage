name: Temporary site verification
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source files
        run: |
          set -euo pipefail
          echo '### WORKFLOWS'
          find .github/workflows -maxdepth 1 -type f -print | sort
          echo '### PAGES'
          find _pages -maxdepth 2 -type f -print | sort
          echo '### DATA'
          find _data -maxdepth 2 -type f -print | sort
          echo '### COLLECTION DIRECTORIES'
          for d in _posts _publications _teaching _portfolio _talks; do
            if [ -e "$d" ]; then
              echo "-- $d"
              find "$d" -type f -print | sort
            fi
          done
          echo '### NAVIGATION'
          cat _data/navigation.yml
          echo '### ABOUT'
          cat _pages/about.md
          echo '### PUBLICATIONS PAGE'
          cat _pages/publications.html
      - name: Verify live URLs and required content
        shell: python
        run: |
          import html
          import re
          import sys
          import urllib.request

          base = 'https://figureenvoydrain.github.io/LJT-Homepage'
          urls = [base + '/', base + '/publications/']
          publications = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          home_required = [
              'Junteng Liu',
              'HKUST NLP Group',
              'Shanghai Jiao Tong University',
              'Hong Kong University of Science and Technology',
              'Computer Science',
              '2024',
              'June 2024',
              '2020',
              'Research Intern',
              'MINIMAX',
              'February 2025',
              'Tencent WXG',
              'June 2024',
              'September 2024',
              'Shanghai AI Lab',
              'June 2023',
              'December 2023',
              'natural language processing',
              'machine learning',
              'LLM Reasoning',
              'Reinforcement Learning',
              'Hallucination',
              'Vision-Language Models',
              'truthfulness',
              'Interpretability',
              'EMNLP 2024',
              'ICML 2024',
              'NeurIPS 2023',
              'Zhiyuan Honor Scholarship',
              'jliugi@connect.ust.hk',
              'https://github.com/Vicent0205',
              'https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate',
              'https://x.com/junteng88716710',
          ] + publications
          publications_required = publications + [
              'SynLogic', 'Vision4Chart', 'Universal_Truthfulness_Hyperplane'
          ]
          forbidden_paths = [
              '/LJT-Homepage/cv/',
              '/LJT-Homepage/teaching/',
              '/LJT-Homepage/portfolio/',
              '/LJT-Homepage/talks/',
              '/LJT-Homepage/blog/',
              '/LJT-Homepage/year-archive/',
              '/LJT-Homepage/markdown/',
              '/LJT-Homepage/sitemap/',
              '/LJT-Homepage/_posts/',
              '/LJT-Homepage/_teaching/',
              '/LJT-Homepage/_portfolio/',
              '/LJT-Homepage/_talks/',
          ]
          failures = []
          for url in urls:
              request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 site-verification'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  raw = response.read().decode('utf-8', errors='replace')
              print(f'URL {url} returned HTTP {status}, {len(raw)} bytes')
              without_hidden = re.sub(r'<(script|style)\\b[^>]*>.*?</\\1>', ' ', raw, flags=re.I | re.S)
              plain = html.unescape(re.sub(r'<[^>]+>', ' ', without_hidden))
              plain = re.sub(r'\\s+', ' ', plain, flags=re.UNICODE)
              required = home_required if url.endswith('/LJT-Homepage/') else publications_required
              missing = [item for item in required if item.lower() not in plain.lower()]
              if missing:
                  failures.append(f'{url} missing: {missing}')
              forbidden = [item for item in forbidden_paths if item in raw]
              if forbidden:
                  failures.append(f'{url} contains forbidden template paths: {forbidden}')
              hrefs = re.findall(r'href=["\']([^"\']+)', raw, flags=re.I)
              internal = sorted(set(h for h in hrefs if '/LJT-Homepage/' in h or h in ('/', '/publications/')))
              print('Internal links:')
              for href in internal:
                  print(' ', href)
              external = sorted(set(h for h in hrefs if h.startswith('http')))
              print('External links:')
              for href in external:
                  print(' ', href)
          if failures:
              print('VERIFICATION FAILED')
              for failure in failures:
                  print(failure)
              sys.exit(1)
          print('VERIFICATION PASSED')
