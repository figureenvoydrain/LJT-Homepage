name: Deploy static site to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-gh-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Build minified JavaScript
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js \
            assets/js/_main.js assets/js/theme.js \
            -c -m -o assets/js/main.min.js

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Disable GitHub Pages Jekyll processing
        run: touch _site/.nojekyll

      - name: Publish built site to gh-pages
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy static LJT-Homepage site"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:gh-pages
