# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "First-year PhD candidate at HKUST NLP Group researching natural language processing and machine learning, including LLM reasoning and reinforcement learning, VLM hallucination, LLM truthfulness, and interpretability."
url: "https://figureenvoydrain.github.io"
baseurl: "/LJT-Homepage"
repository: "figureenvoydrain/LJT-Homepage"

# Site Author
author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group researching natural language processing and machine learning, including LLM reasoning and reinforcement learning, VLM hallucination, truthfulness, and interpretability."
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Site Settings
breadcrumbs: false
future: true
read_more: "disabled"
talkmap_link: false
atom_feed:
  hide: true

comments:
  provider: false

# Social media metadata
twitter:
  username: "junteng88716710"

# Reading Files
include:
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - AGENTS.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap_out.ipynb
  - tmp
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Template collections are not used because all content is on two pages.
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: false
    permalink: /:collection/:path/
  portfolio:
    output: false
    permalink: /:collection/:path/
  talks:
    output: false
    permalink: /:collection/:path/

# Default front matter for ordinary pages
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# No Jekyll generator plugins are needed for the static About and Publications pages.
plugins: []
whitelist: []

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  ignore:
    envs: development
